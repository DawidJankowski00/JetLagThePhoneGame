name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  libraries:
    name: Libraries + tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test TransitGames.Libraries.slnf -c Release

  android:
    name: Android app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android
      - run: dotnet build src/TransitGames.App/TransitGames.App.csproj -f net10.0-android -c Release

  ios:
    name: iOS app (compile only, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-ios
      - run: >
          dotnet build src/TransitGames.App/TransitGames.App.csproj -f net10.0-ios -c Debug
          -p:EnableIos=true -p:RuntimeIdentifier=iossimulator-arm64 -p:EnableCodeSigning=false
